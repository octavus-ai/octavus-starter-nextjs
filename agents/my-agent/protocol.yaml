# My Agent Protocol
# A simple chat agent to get you started

# Input - provided when starting the agent
input:
  COMPANY_NAME:
    type: string
    description: Your company name

  USER_ID:
    type: string
    description: The current user's ID
    optional: true

# Types - reusable parameter shapes
types:
  TicketPriority:
    type: string
    enum: [low, medium, high, urgent]
    description: How urgently the ticket needs attention

# Triggers - how the agent can be invoked
triggers:
  user-message:
    description: User sends a chat message
    input:
      USER_MESSAGE:
        type: string
        description: The user's message
      FILES:
        type: file[]
        optional: true
        description: Documents or images for analysis (PDFs, images, text files)

# Tools - provided by your application
# `title` is the label the user sees; `description` is written for the model.
tools:
  get-user-account:
    display: title
    title: Looking up your account
    description: Look up the user's account - name, email, plan, and signup date - by user ID.
    parameters:
      userId:
        type: string
        description: The user ID to look up

  create-support-ticket:
    display: title
    title: Creating a support ticket
    description: Create a support ticket for an issue you cannot resolve in the conversation.
    parameters:
      summary:
        type: string
        description: Summary of the issue
      priority:
        type: TicketPriority
        description: Priority level of the ticket

# Agent configuration
agent:
  model: anthropic/claude-sonnet-5-5
  system: system
  input:
    - COMPANY_NAME
    - USER_ID
  tools:
    - get-user-account
    - create-support-ticket
  imageModel: google/gemini-3-pro-image
  agentic: true
  maxSteps: 10
  thinking: medium

# Handlers - what happens when triggers fire
handlers:
  user-message:
    Add user message:
      block: add-message
      role: user
      prompt: user-message
      input:
        - USER_MESSAGE
      files:
        - FILES
      display: hidden

    Respond to user:
      block: next-message
